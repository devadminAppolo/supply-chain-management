spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/supply_chain_db
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: scm
        format_sql: true

    show-sql: true

  flyway:
    enabled: true
    create-schemas: true
    default-schema: scm
    schemas: scm
    locations: classpath:db/migration

  thymeleaf:
    cache: false

server:
  port: 4001