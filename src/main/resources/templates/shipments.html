<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Supply Chain</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Main Content -->
        <div class="col-md-10 p-4">

            <h2 class="mb-4">
                Supply Chain Management 🚀
            </h2>

            <form th:action="@{/shipments}"
                  th:object="${shipment}"
                  method="post">

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{shipmentNumber}"
                           placeholder="Shipment Number">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{customerName}"
                           placeholder="Customer Name">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{origin}"
                           placeholder="Origin">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{destination}"
                           placeholder="Destination">
                </div>

                <button class="btn btn-primary">
                    Save Shipment
                </button>

            </form>

            <hr>

            <table class="table table-bordered table-hover mt-4">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Shipment</th>
                    <th>Customer</th>
                    <th>Origin</th>
                    <th>Destination</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="shipment : ${shipments}">

                    <td th:text="${shipment.id}"></td>
                    <td th:text="${shipment.shipmentNumber}"></td>
                    <td th:text="${shipment.customerName}"></td>
                    <td th:text="${shipment.origin}"></td>
                    <td th:text="${shipment.destination}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
