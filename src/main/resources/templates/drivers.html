<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Driver Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Content -->
        <div class="col-md-10 p-4">

            <h2 class="mb-4">Driver Master</h2>

            <form th:action="@{/drivers}"
                  th:object="${driver}"
                  method="post">

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{driverNumber}"
                           placeholder="Driver Number">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{driverName}"
                           placeholder="Driver Name">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{licenseNumber}"
                           placeholder="License Number">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{phoneNumber}"
                           placeholder="Phone Number">
                </div>

                <button class="btn btn-primary">
                    Save Driver
                </button>

            </form>

            <hr>

            <table class="table table-bordered table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Driver Number</th>
                    <th>Driver Name</th>
                    <th>License Number</th>
                    <th>Phone Number</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="driver : ${drivers}">

                    <td th:text="${driver.id}"></td>
                    <td th:text="${driver.driverNumber}"></td>
                    <td th:text="${driver.driverName}"></td>
                    <td th:text="${driver.licenseNumber}"></td>
                    <td th:text="${driver.phoneNumber}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
