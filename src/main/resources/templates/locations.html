<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Location Master</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 p-0">
            <div th:replace="fragments/sidebar :: sidebar"></div>
        </div>

        <!-- Content -->
        <div class="col-md-10 p-4">

            <h2 class="mb-4">Location Master</h2>

            <form th:action="@{/locations}"
                  th:object="${location}"
                  method="post">

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{locationCode}"
                           placeholder="Location Code">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{locationName}"
                           placeholder="Location Name">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{city}"
                           placeholder="City">
                </div>

                <div class="mb-3">
                    <input class="form-control"
                           th:field="*{state}"
                           placeholder="State">
                </div>

                <button class="btn btn-primary">
                    Save Location
                </button>

            </form>

            <hr>

            <table class="table table-bordered table-hover">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Location Code</th>
                    <th>Location Name</th>
                    <th>City</th>
                    <th>State</th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="location : ${locations}">

                    <td th:text="${location.id}"></td>
                    <td th:text="${location.locationCode}"></td>
                    <td th:text="${location.locationName}"></td>
                    <td th:text="${location.city}"></td>
                    <td th:text="${location.state}"></td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
