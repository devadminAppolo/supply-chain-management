# Server
server.port=4001

server.servlet.contextPath=/scm

  # Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/supply_chain_db
spring.datasource.username=postgres
spring.datasource.password=root

  # JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=scm
spring.jpa.properties.hibernate.format_sql=true

  # Flyway
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=scm
spring.flyway.schemas=scm
spring.flyway.locations=classpath:db/migration

  # Thymeleaf
spring.thymeleaf.cache=false


application.cors.allowed-origins=http://localhost:5173
application.cors.allowed-methods=*
application.cors.allowed-headers=*
application.cors.allowed-credentials =true